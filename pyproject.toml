[project]
name = "agent"
version = "0.1.0"
description = "Triage Support Tickets from Kaggle Dataset"
readme = "README.md"
authors = [
    { name = "Rihab Al-Yasiri", email = "rihab.al-yasiri@web.de" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.10,<2",
    "ollama>=0.6.2",
    "openai>=3.19.2",
    "pandas>=3.0.6",
    "qwen-agent>=0.0.34",
    "rich>=15.0.0",
    "soundfile>=0.14.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "uuid>=1.30",
]

[project.scripts]
triage = "agent:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
